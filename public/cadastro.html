<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/cadastro.js"></script>
</head>
    <h1 class="text-center">Cadastre-se</h1>
 <body>
    <div class="container">
       <label for="usuario">Nome</label><br> 
      <input type="text" id="usuario" name="usuario" placeholder="Digite aqui Nome" class="form-control"><br>
      <label for="profissao">Profissão:</label><br>
      <input type="text" id="profissao" name="profissao" placeholder="Digite aqui" class="form-control"><br>
       <label for="email">E-mail:</label><br>
      <input  id="email" name="email" placeholder="Digite aqui" class="form-control"><br>
      <label for="senha">Senha:</label><br>
      <input type="password" id="senha" name="senha" placeholder="Digite aqui" class="form-control"><br>
      <label for="senha2">Repita a Senha:</label><br>
      <input type="password" id="senha2" name="senha2" placeholder="Digite aqui" class="form-control"><br><br>
      <input type="submit" value="Cadastrar" class="btn btn-success" onclick="cadastrar()">
      <input type="reset" value="Resetar" class="btn btn-primary" onclick="resetar()">
      <br><br>
      <a href="/">Login</a>
  </div> 
     
 </body>
</html>
